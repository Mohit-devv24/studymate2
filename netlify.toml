# Netlify Configuration for StudyMate Monorepo
# Base directory points to Vite React SPA in web/

[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  VITE_API_URL = "https://studymate2-s38r.onrender.com"
  VITE_API_BASE_URL = "https://studymate2-s38r.onrender.com"

# Client-side SPA routing fallback for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
